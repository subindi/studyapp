<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>스킨 표정 적용 샘플</title><link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="emotions.css"><style>body{margin:0;padding:24px;background:var(--skin-background);color:var(--skin-ink);font:18px/1.6 system-ui,sans-serif}main{max-width:900px;margin:auto}.phone{max-width:390px;margin:24px auto;padding:24px;border:1px solid var(--skin-border);border-radius:32px;background:linear-gradient(var(--skin-soft),white)}header{display:flex;justify-content:space-between}h1{font-size:28px}h2{font-size:22px}.scene{text-align:center;padding:24px 0}.skin-emotion{--emotion-size:210px}.message{font-weight:bold;font-size:24px;min-height:76px}.task{padding:16px;margin:8px 0;border-radius:18px;background:var(--skin-soft)}button{font:inherit;cursor:pointer;border:1px solid var(--skin-border);border-radius:14px;padding:12px 16px;background:white;color:var(--skin-ink);min-height:48px}button:focus-visible{outline:3px solid var(--skin-primary);outline-offset:3px}.controls{display:flex;flex-wrap:wrap;gap:10px}button[aria-pressed=true]{background:var(--skin-primary);color:white}.note{font-size:15px;color:var(--skin-muted)}</style><body data-theme="siyun-seal"><main><h1>시윤이와 물범의 작은 바다</h1><p>버튼을 눌러 같은 스킨 안에서 9가지 표정과 안내 문구를 확인하세요.</p><div class="phone"><header><b>스스로</b><span>시윤이</span></header><section class="scene"><span id="mascot" class="skin-emotion" data-emotion="hello" aria-hidden="true"></span><p id="message" class="message" aria-live="polite">반가워!</p></section><h2>오늘의 미션</h2><div class="task">책 읽기 15분</div><div class="task">수학 10문제</div><div class="task">영어 듣기 10분</div><p class="note">표정 적용용 디자인 데모 · 실제 학습 기록과 보상은 저장하지 않습니다.</p></div><div class="controls"><button type="button" data-state="hello">반가워!</button><button type="button" data-state="well-done">수고했어!</button><button type="button" data-state="celebrate">해냈어!</button><button type="button" data-state="encourage">함께 해보자!</button><button type="button" data-state="try-again">괜찮아, 다시 해보자</button><button type="button" data-state="start-soon">이제 시작해볼까?</button><button type="button" data-state="focus">하나씩 차근차근</button><button type="button" data-state="rest">잠깐 쉬어도 괜찮아</button><button type="button" data-state="sleep">잘 자, 내일 또 만나</button></div><p><a href="preview.html">전체 스킨 시안</a> · <a href="emotions-preview.html">표정 모아보기</a></p></main><script>const labels={"hello": "반가워!", "well-done": "수고했어!", "celebrate": "해냈어!", "encourage": "함께 해보자!", "try-again": "괜찮아, 다시 해보자", "start-soon": "이제 시작해볼까?", "focus": "하나씩 차근차근", "rest": "잠깐 쉬어도 괜찮아", "sleep": "잘 자, 내일 또 만나"};document.querySelectorAll('[data-state]').forEach(button=>{button.setAttribute('aria-pressed',String(button.dataset.state==='hello'));button.addEventListener('click',()=>{document.getElementById('mascot').dataset.emotion=button.dataset.state;document.getElementById('message').textContent=labels[button.dataset.state];document.querySelectorAll('[data-state]').forEach(other=>other.setAttribute('aria-pressed',String(other===button)));});});</script></body></html>
