# 스스로 nginx (컨테이너 안, 80번)
# HTTPS 는 서버 앞단(호스트 nginx + certbot 등)에서 처리하고 이 컨테이너로 넘겨준다고 가정

map $http_x_forwarded_proto $fwd_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# 해시 이름이 붙은 빌드 파일은 오래 캐시, 나머지(첫 화면·서비스 워커·API)는 매번 확인
map $uri $cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    default    "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 256k;
    server_tokens off;

    # 실제 접속자 IP: 사설망(호스트 nginx, 도커 네트워크)에서 온 X-Forwarded-For 만 믿는다
    # → 로그인·초대 코드 시도 제한이 접속자별로 동작하고, 헤더 위조로 피할 수 없다
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    # 모든 응답 공통 (location 안에서 add_header 를 쓰면 이 값들이 사라지므로 여기에서만 지정)
    add_header Cache-Control $cache_control always;
    add_header X-Robots-Tag "noindex, nofollow" always;   # 가족용: 검색 엔진에 노출하지 않음
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header X-Frame-Options "DENY" always;

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # API → Spring Boot (접속자 IP 는 위에서 확정한 값으로 덮어써서 넘긴다)
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $fwd_proto;
        proxy_read_timeout 30s;
    }

    location /assets/ {
        try_files $uri =404;
    }

    # 화면 주소는 모두 index.html (한 페이지 앱)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
